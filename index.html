<style>
  *{box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{margin:0;background:#000;-webkit-font-smoothing:antialiased}
  /* Fixed in both orientations, so the box the element is positioned against
     never changes underneath it. Upright it carries no transform at all: a
     transformed ancestor invites the compositor to rasterise the canvas at its
     own chosen scale and then stretch the result. */
  .screen{position:fixed;top:0;left:0;width:100vw;height:100vh;
          transform-origin:center;
          display:flex;align-items:center;justify-content:center;background:#000}
  @supports (height:1svh){ .screen{ height:100svh; } }
  /* No will-change or translateZ here. Promoting a canvas to its own 3D layer
     hands its contents scale to the compositor, which is free to rasterise the
     texture at a scale of its choosing and stretch it, and that is a soft canvas
     the page cannot measure its way out of. A canvas gets its own layer anyway. */
  .screen canvas{display:block;touch-action:none;cursor:pointer;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  .screen canvas:focus{outline:none}
  /* Portrait lock. Android obeys the manifest and never reaches this. iOS gives
     a web page no orientation lock at all, so a phone held sideways gets the
     whole screen turned back a quarter turn instead. The max-height guard keeps
     a desktop browser in landscape out of it. */
  @media (orientation:landscape) and (max-height:600px){
    .screen{top:50%;left:50%;width:100vh;height:100vw;
            transform:translate(-50%,-50%) rotate(90deg)}
    /* Turning the other way has to be answered the other way, or the game reads
       upside down in one of the two landscapes. */
    html[data-rot="ccw"] .screen{transform:translate(-50%,-50%) rotate(-90deg)}
  }
  @supports (height:1svh){
    @media (orientation:landscape) and (max-height:600px){
      .screen{width:100svh;height:100svw}
    }
  }
</style>

<script>
window.PORTRAIT_LOCK = true;
(function(){
  /* screen.orientation.angle counts counter-clockwise from the device's natural
     orientation, so 90 means the phone was turned counter-clockwise and the
     page has to turn back the same way. */
  var el = document.documentElement;
  function set(){
    var a = 0, so = window.screen && screen.orientation;
    if (so && typeof so.angle === "number") a = so.angle;
    else if (typeof window.orientation === "number") a = ((window.orientation % 360) + 360) % 360;
    el.setAttribute("data-rot", a === 90 ? "ccw" : a === 270 ? "cw" : "none");
  }
  set();
  var so = window.screen && screen.orientation;
  if (so && so.addEventListener) so.addEventListener("change", set);
  window.addEventListener("orientationchange", set);
  window.addEventListener("resize", set);
})();
</script>

function audioInit(){

     which a web page cannot remove; this asks for as little of it as possible. */

   and a ball surviving a hit); two copies of bubble 1, a fifth apart and 125 ms
   apart, end the round. Both bubbles
   are cut back to the zero crossing before their loudest sample, raised a tone,
   given a short burst of their own derivative on the front and a fast decay, so
   each one is at full level within a quarter millisecond and gone in under

   it rings; a bubble that swells and then hangs reads as late even when it
   started on time. Nothing on release. */

     against it sits there and fires whenever the context next wakes, which is
     usually the following press. That arrives as a hit sound from several
     seconds ago. Better to lose the sound and wake the context for the next
     one. */

/* Sizing is measured only when the element actually changes size. Reading
   getBoundingClientRect inside the animation loop forced a synchronous layout
   of the whole page on every frame, which is what made this stutter. The
   backing store is capped at 2x: past that the extra pixels cost real
   fill rate and buy nothing visible on flat vector art. */
/* iOS gives a web app no way to lock the orientation: screen.orientation.lock
   is unimplemented in Safari and the manifest's orientation field is ignored.
   The deploy build therefore turns the whole screen a quarter turn in CSS when
   a phone is held sideways, so the game still presents as portrait. That makes
   two things wrong here unless they are handled: getBoundingClientRect returns

  /* clientWidth and clientHeight are the box before any transform, which is the
     one the canvas has to fit into. */
  const host = cvs.parentNode;
  const box = { width: host.clientWidth, height: host.clientHeight };
  if (!box.width || !box.height) return;

     whole device pixels and derive the CSS size back from it. Sizing the other
     way round leaves the canvas on a half device pixel and every crisp edge
     shimmers as things move across it. */
  const dpr = window.devicePixelRatio || 1;
  const scale = Math.min(box.width / W, box.height / H);
  /* Whole device pixels in the buffer, and, where the ratio is a whole number,
     a whole number of CSS pixels in both directions as well. A layer sitting on
     a fractional CSS size gets snapped to the pixel grid by the compositor and
     its texture stretched to suit, and that is a soft canvas no amount of
     re-measuring will fix.

     rounded to the nearest whole CSS pixel. That is at most half a pixel, a
     shape error under a tenth of a percent, and the drawing still uses one
     uniform scale so nothing is stretched. */
  let bw, bh;
  if (Math.abs(dpr - Math.round(dpr)) < 1e-6) {
    const d = Math.round(dpr);
    let cw = Math.max(1, Math.floor(W * scale));
    let ch = Math.round(cw * H / W);
    if (ch > Math.floor(box.height)) { ch = Math.floor(box.height); cw = Math.round(ch * W / H); }
    bw = cw * d; bh = ch * d;

    bw = Math.max(1, Math.round(W * scale * dpr));
    bh = Math.round(H * (bw / W));

  cvs.style.height = (bh / dpr) + "px";

/* ---------------------------------------------------------------- state */
let statics = [];

let score = 0;
let high = store.get("high", 0);
let nextType = "normal";
let aiming = false, aimAngle = 0, aimDir = 1, armed = false;
let pts = [];
let prevAim = 0, alphaT = 0;
let aimDelay = 0;          // dead time after a press, before the arrow moves
let dying = 0;             // seconds of play left to watch before the game over screen
function lerp(a, b, t){ return a + (b - a) * t; }

const ARROW_DY  = ARROW_BASE - (SHOT_R + ARROW_GAP);
const ARROW_LEN = 64.3 - ARROW_DY;   // tip height above the ball's centre

  if (turn === 0) { nextType = "normal"; turn++; pity++; return; }

    nextType = "razor"; pity = 0;

  }

   runs no handler at all when they do, so the file on disk would still be the
   field as it stood before the shot. The launch is therefore written the

   record runs forward to exactly the outcome the shot was going to have. */
function saveLaunch(){
  if (!ball) return;
  saveDue = false;
  try {
    store.set("game", { s: statics, sc: score, t: turn, p: pity, ty: ball.type,

/* Run the shot forward with nothing drawn and no sound until the turn ends,

  replaying = true;

  const k = (typeof g.h === "number" && g.h > 0) ? H / g.h : 1;   // older saves

/* ---------------------------------------------------------------- input */
function canvasPoint(ev){
  const r = cvs.getBoundingClientRect();

       back is lx = dy, ly = -dx; at -90 it is (ly, -lx), so back is lx = -dy,
       ly = dx. */
    const t = dx;
    if (rd < 0) { dx = -dy; dy = t; }
    else        { dx =  dy; dy = -t; }
    wpx = r.height; hpx = r.width;
  }
  return { x: (dx + wpx/2) / wpx * W, y: (dy + hpx/2) / hpx * H };
}
/* Most buttons still carry the original 320x480 design's y and get scaled; the
   main menu carries its own, because its arrangement is measured off the
   bundle's artwork and has to sit in the taller field on its own terms. */
function btnY(b){
  if (typeof b.fy === "function") return b.fy();
  return b.fy === undefined ? V(b.y) : b.fy;
}
function menuHit(p){
  const list = MENUS[scene]; if (!list) return null;
  for (const b of list) if (Math.hypot(p.x-b.x, p.y-btnY(b)) <= b.r) return b;
  return null;
}
function press(p){
  audioInit(); if (actx && actx.state === "suspended") actx.resume();
  if (scene === SC.GAME) {
    /* The one thing on the field that is a button rather than somewhere to aim
       from, so it has to be checked before the press becomes an aim. */
    if (p && Math.hypot(p.x - FIELD_MENU.x, p.y - FIELD_MENU.fy) <= FIELD_MENU.r) {
      play("tap", 0.5); FIELD_MENU.act(); return;
    }
    // resumes from the angle it stopped at, but always sweeping rightward first
    if (ball && ball.state === "aim") { aiming = true; aimDir = 1; aimDelay = P.aimDelay; }
    return;
  }
  /* A row takes the press before the round buttons get a look, and takes it
     silently, because a drag is not a button press. */
  /* the sound button makes its own noise, or none, so it is skipped here */
  if (p) { const b = menuHit(p); if (b) { if (!b.sound && !b.quiet) play("tap", 0.5); b.act(); } }
}
function release(){
  if (scene === SC.GAME && aiming && ball && ball.state === "aim") {
    aiming = false;
    const a = aimAngle;
    ball.vx =  Math.sin(a) * P.speed;
    ball.vy = -Math.cos(a) * P.speed;
    ball.state = "fly";
    armed = false;
    saveLaunch();
  }
  aiming = false;
}
cvs.addEventListener("pointerdown", function(e){ e.preventDefault(); cvs.focus(); press(canvasPoint(e)); });
window.addEventListener("pointerup", function(){ release(); });
window.addEventListener("pointercancel", function(){ aiming = false; });
cvs.addEventListener("keydown", function(e){
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); if (!aiming) press(null); }
  else if (e.key === "Escape") { if (scene === SC.GAME) scene = SC.MENU; }
});
cvs.addEventListener("keyup", function(e){ if (e.key === " " || e.key === "Enter") { e.preventDefault(); release(); } });

/* ---------------------------------------------------------------- rules */
function mult(type){ return type === "double" ? 2 : type === "triple" ? 3 : 1; }
/* Striped balls appear to roll off whatever they touch. Cosmetic only: the kick
   comes from the tangential part of the velocity at the contact and never feeds
   back into vx or vy. */
function spinKick(nx, ny){
  if (ball.type !== "double" && ball.type !== "triple") return;
  const vt = ball.vx * (-ny) + ball.vy * nx;
  ball.spinVel += vt / Math.max(8, ball.r) * 0.715;   // 0.55 + 30%
  if (ball.spinVel >  21) ball.spinVel =  21;
  if (ball.spinVel < -21) ball.spinVel = -21;
}

/* hx,hy is a point along the impact normal, POP_PULL of the way out from the
   removed ball's centre toward where the shot touched it. */
function removeStatic(s, gain, hx, hy){
  const i = statics.indexOf(s); if (i < 0) return;
  statics.splice(i, 1);
  score += gain;
  pts.push({ x: (hx === undefined ? s.x : hx), y: (hy === undefined ? s.y : hy), n:gain, t:0 });
  play("pop", 0.55);
  if (score > high) { high = score; highDue = true; }
}
function hitStatic(s, type, hx, hy){
  if (s.cool > 0) return;
  s.cool = 0.18;
  if (type === "razor") { removeStatic(s, 1, hx, hy); return; }
  s.hits -= 1;
  if (s.hits <= 0) removeStatic(s, mult(type), hx, hy);
  else play("tap", 0.5);
}
/* Death is not instant: the sound lands and the ball is left to travel for a
   moment so you see what killed you, then the screen comes up. */
const REST_HOLD = 1/6;       // pause once the ball stops, before grow or vanish
const DEATH_HOLD = 0.35;
/* The failure sound lands a beat after the ball is lost rather than on top of
   it, so the hit and the verdict are two separate events. */
const OVER_DELAY = 0.15;
const DEATH_SLOWMO = 0.30;   // the last moment plays slowly enough to read
function gameOver(){
  if (dying > 0) return;
  aiming = false;
  inPlay = false; saveGame();
  play("over", 0.7, OVER_DELAY);
  dying = DEATH_HOLD;
}
function endRound(){
  ball = null; overFlash = 1; dying = 0;
  scene = SC.OVER;
}
function land(){
  if (!armed) { gameOver(); return; }
  /* Put the ball back inside first: wedged between statics it can finish a
     substep slightly out of bounds, which made the clearance come out negative
     and the SHOT_R floor below then grew it straight through the wall. */
  ball.x = Math.min(FIELD_R - ball.r, Math.max(FIELD_L + ball.r, ball.x));
  ball.y = Math.max(FIELD_TOP + ball.r, ball.y);
  ball.px = ball.x; ball.py = ball.y;
  const wall = Math.min(ball.x - FIELD_L, FIELD_R - ball.x,
                        ball.y - FIELD_TOP, P.baseline - ball.y);
  let t = wall;
  for (const s of statics) t = Math.min(t, Math.hypot(ball.x-s.x, ball.y-s.y) - s.r);
  t = Math.max(SHOT_R, t);
  t = Math.max(2, Math.min(t, wall));   // the floor may not breach a boundary
  ball.type = "normal";
  ball.r0 = ball.r; ball.target = t; ball.gt = 0;
  ball.state = "grow";
}

function stepBall(dt){
  if (!ball) return;
  ball.px = ball.x; ball.py = ball.y; ball.pr = ball.r; ball.pspin = ball.spin;
  prevAim = aimAngle;
  if (ball.state === "aim") {
    if (aiming) {
      /* A short dead time so a quick tap barely moves the arrow at all. */
      if (aimDelay > 0) { aimDelay -= dt; return; }
      const lim = 80 * Math.PI / 180;   // 160 degrees of release arc in total
      aimAngle += aimDir * P.sweep * Math.PI/180 * dt;
      if (aimAngle >  lim) { aimAngle =  lim; aimDir = -1; }
      if (aimAngle < -lim) { aimAngle = -lim; aimDir =  1; }
    }
    return;
  }
  /* A ball that has come to rest waits a beat before it does anything, so the
     stop reads as a stop rather than running straight into the next animation. */
  if (ball.state === "rest") {
    ball.gt += dt;
    if (ball.gt >= REST_HOLD) {
      if (ball.type === "razor") { ball.r0 = ball.r; ball.gt = 0; ball.state = "spend"; }
      else land();
    }
    return;
  }
  if (ball.state === "spend") {
    ball.gt += dt;
    const k = Math.min(1, ball.gt / 0.32);
    ball.r = ball.r0 * (1 - k*k);
    ball.spin += (1 - k) * 9 * dt;
    if (k >= 1) readyBall();
    return;
  }
  if (ball.state === "grow") {
    ball.gt += dt;
    const k = P.growTime > 0 ? Math.min(1, ball.gt / P.growTime) : 1;
    ball.r = ball.r0 + (ball.target - ball.r0) * k;
    if (k >= 1) {
      ball.r = ball.target;
      statics.push({ x:ball.x, y:ball.y, r:ball.r, hits:2, cool:0, type:"normal" });
      readyBall();
      saveGame();
    }
    return;
  }

  const sp = Math.hypot(ball.vx, ball.vy);
  if (ball.type === "razor") ball.spin += sp * 0.030 * dt;
  else if (ball.type === "double" || ball.type === "triple") {
    ball.spin += ball.spinVel * dt;
    ball.spinVel *= Math.pow(0.22, dt);
  }
  const sub = Math.max(1, Math.min(8, Math.ceil(sp * dt / 3)));
  const h = dt / sub;
  for (let k = 0; k < sub; k++) {
    /* Plain exponential decay takes the same fraction per second whatever the
       speed, which is why the tail of the roll feels slippery. Below gripAt the
       retained fraction is scaled down on a ramp that is 0 at the threshold and
       1 at a standstill, so the bite arrives gradually and there is no step at
       the crossing point. grip = 1 leaves the old behaviour untouched. */
    const v = Math.hypot(ball.vx, ball.vy);
    let keep = P.friction;
    if (P.gripAt > 0 && v < P.gripAt) {
      keep = P.friction * Math.pow(P.grip, 1 - v / P.gripAt);
    }
    const f = Math.pow(keep, h);
    ball.vx *= f; ball.vy *= f;
    ball.x += ball.vx * h;
    ball.y += ball.vy * h;

    for (let i = statics.length - 1; i >= 0; i--) {
      const s = statics[i];
      const dx = ball.x - s.x, dy = ball.y - s.y;
      const d = Math.hypot(dx, dy);
      if (d >= s.r + ball.r) continue;
      const nx = dx/(d||1), ny = dy/(d||1);
      if (ball.type === "razor") { hitStatic(s, "razor", s.x + nx*s.r*POP_PULL, s.y + ny*s.r*POP_PULL); continue; }
      ball.x = s.x + nx*(s.r + ball.r);
      ball.y = s.y + ny*(s.r + ball.r);
      spinKick(nx, ny);
      const scoring = dying <= 0;
      const dot = ball.vx*nx + ball.vy*ny;
      ball.vx = (ball.vx - 2*dot*nx) * P.bounce;
      ball.vy = (ball.vy - 2*dot*ny) * P.bounce;
      if (scoring) hitStatic(s, ball.type, s.x + nx*s.r*POP_PULL, s.y + ny*s.r*POP_PULL);
    }

    /* Walls last. Pushing clear of a static can eject the ball past a wall, and
       running this first left it outside until the following substep. */
    if (ball.x - ball.r < FIELD_L) { ball.x = FIELD_L + ball.r; spinKick(1, 0); ball.vx = -ball.vx * P.bounce; }
    if (ball.x + ball.r > FIELD_R) { ball.x = FIELD_R - ball.r; spinKick(-1, 0); ball.vx = -ball.vx * P.bounce; }
    if (ball.y - ball.r < FIELD_TOP) { ball.y = FIELD_TOP + ball.r; spinKick(0, 1); ball.vy = -ball.vy * P.bounce; }

    if (!armed && ball.y + ball.r < P.baseline) armed = true;
    if (dying <= 0 && ball.type !== "razor") {
      /* Turning back downward without ever having cleared the line ends it on
         the spot, rather than letting the ball wander below and off screen. */
      if (!armed && ball.vy > 0) { gameOver(); break; }
      if (armed && ball.vy > 0 && ball.y + ball.r >= P.baseline) { gameOver(); break; }
    }
    if (ball.y - ball.r > H + 40) {
      if (ball.type === "razor") { readyBall(); return; }
      if (dying > 0) { endRound(); return; }
      gameOver(); return;
    }
  }

  if (dying <= 0 && Math.hypot(ball.vx, ball.vy) < P.stopAt) {
    ball.vx = 0; ball.vy = 0;
    ball.gt = 0; ball.state = "rest";
  }
}

function stepWorld(dt){
  if (dying > 0) { dying -= dt; if (dying <= 0) { endRound(); return; } }
  for (const s of statics) if (s.cool > 0) s.cool -= dt;
  for (let i = pts.length - 1; i >= 0; i--) {
    pts[i].t += dt; pts[i].y -= 26*dt;
    if (pts[i].t > 0.9) pts.splice(i, 1);
  }
  if (overFlash > 0) overFlash = Math.max(0, overFlash - dt*1.4);
  if (scene === SC.GAME) stepBall(dying > 0 ? dt * DEATH_SLOWMO : dt);
}

/* ---------------------------------------------------------------- draw */
/* Vector balls. Proportions measured off the decoded PVRTC textures:
   ring outer 1.00R, ring inner 0.875R, inner disc 0.75R, stripe width 0.17R;
   razor hole 0.55R, spike valley 0.72R, 12 points. */
function stripeBars(x, y, r, n, clipR, color, spin){
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, clipR, 0, Math.PI*2); ctx.clip();
  ctx.translate(x, y); ctx.rotate(-Math.PI/4 + (spin || 0));
  ctx.fillStyle = color;
  const wd = Math.max(1, r*0.17), span = r*1.6, gap = n === 2 ? r*0.80 : r*0.52;
  for (let i = 0; i < n; i++) ctx.fillRect(-span, (i - (n-1)/2)*gap - wd/2, span*2, wd);
  ctx.restore();
}
function drawBall(x, y, r, type, hits, spin){
  const G = "#00ff00";
  if (r <= 0.6) return;
  if (type === "razor") {
    const pts = 12, off = spin || 0;
    ctx.beginPath();
    for (let i = 0; i < pts*2; i++) {
      const a = i/(pts*2)*Math.PI*2 - Math.PI/2 + off;
      const rr = (i % 2 === 0) ? r : r*0.72;
      const px = x + Math.cos(a)*rr, py = y + Math.sin(a)*rr;
      if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
    }
    ctx.closePath();
    ctx.moveTo(x + r*0.55, y);
    ctx.arc(x, y, r*0.55, 0, Math.PI*2, true);
    ctx.closePath();
    ctx.fillStyle = G; ctx.fill("evenodd");
    return;
  }
  ctx.beginPath();
  ctx.arc(x, y, r*0.9375, 0, Math.PI*2);
  ctx.lineWidth = Math.max(1, r*0.125);
  ctx.strokeStyle = G;
  ctx.stroke();
  const n = type === "double" ? 2 : type === "triple" ? 3 : 0;
  if (hits >= 2) {
    ctx.beginPath(); ctx.arc(x, y, r*0.75, 0, Math.PI*2);
    ctx.fillStyle = G; ctx.fill();
    if (n) stripeBars(x, y, r, n, r*0.75, "#000000", spin);
  } else if (n) {
    stripeBars(x, y, r, n, r*0.80, G, spin);
  }
}
/* x,y is the baseline. drawNumberMid centres the digits on y instead. */
function drawNumber(n, x, y, px, align, color){
  ctx.font = "700 " + px + "px " + BARLOW;
  ctx.textAlign = align || "left";
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = color || "#00ff00";
  ctx.fillText(String(n), x, y);
}
function drawNumberMid(n, x, cy, px, align){
  drawNumber(n, x, cy + px * NUMCAP / 2, px, align);
}
/* Every ring is as thick, relative to its own radius, as the play circle's:
   12 on 91. The artwork was not consistent about this and the difference shows
   most at the small sizes, where a fixed weight reads as a heavy blob. */
const RING_K = 12 / 91;
/* The three big buttons sit at dr/r of .773, .791 and .775; the toggles have no
   measured disc of their own, so they take the average. */
const TOGGLE_DR = 0.78;
function ringW(b){ return b.rw === undefined ? b.r * RING_K : b.rw; }
function ring(x, y, r, lw){
  ctx.beginPath(); ctx.arc(x, y, r - lw/2, 0, Math.PI*2);
  ctx.fillStyle = "#000"; ctx.fill();
  ctx.lineWidth = lw; ctx.strokeStyle = "#00ff00"; ctx.stroke();
}
function label(text, x, y, size, color, align, weight, face, lhm){
  ctx.font = (weight||500) + " " + size + "px " + (face || FREDOKA);
  ctx.textAlign = align || "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = color || "#00ff00";
  const lines = String(text).split("\n");
  const lh = size * (lhm || 1.02);
  for (let i=0;i<lines.length;i++) ctx.fillText(lines[i], x, y + (i - (lines.length-1)/2) * lh);
}
/* Body copy is Barlow at 400, its regular. */
const BODYWT = 400;
function body(text, x, y, size, maxw, color){
  ctx.font = BODYWT + " " + size + "px " + BARLOW;
  ctx.textAlign = "left"; ctx.textBaseline = "top";
  ctx.fillStyle = color || "#d8f5d8";
  const words = String(text).split(" ");
  let line = "", yy = y;
  for (let i=0;i<words.length;i++){
    const test = line ? line + " " + words[i] : words[i];
    if (ctx.measureText(test).width > maxw && line) { ctx.fillText(line, x, yy); yy += size*1.42; line = words[i]; }
    else line = test;
  }
  if (line) { ctx.fillText(line, x, yy); yy += size*1.42; }
  return yy;
}
/* The speaker icon, from a 24 by 24 drawing. The speaker itself is its own path

const ICON_SPEAKER = new Path2D("M11.38,4.08a1,1,0,0,0-1.09.21L6.59,8H4a2,2,0,0,0-2,2v4a2,2,0,0,0,2,2H6.59l3.7,3.71A1,1,0,0,0,11,20a.84.84,0,0,0,.38-.08A1,1,0,0,0,12,19V5A1,1,0,0,0,11.38,4.08Z");
const ICON_WAVES = new Path2D("M18.36,19.36a1,1,0,0,1-.7-.29,1,1,0,0,1,0-1.41,8,8,0,0,0,0-11.32,1,1,0,0,1,1.41-1.41,10,10,0,0,1,0,14.14A1,1,0,0,1,18.36,19.36Z M15.54,16.54a1,1,0,0,1-.71-.3,1,1,0,0,1,0-1.41,4,4,0,0,0,0-5.66,1,1,0,0,1,1.41-1.41,6,6,0,0,1,0,8.48A1,1,0,0,1,15.54,16.54Z");
const ICON_MUTE = new Path2D("M16,15.5a1,1,0,0,1-.71-.29,1,1,0,0,1,0-1.42l5-5a1,1,0,0,1,1.42,1.42l-5,5A1,1,0,0,1,16,15.5Z M21,15.5a1,1,0,0,1-.71-.29l-5-5a1,1,0,0,1,1.42-1.42l5,5a1,1,0,0,1,0,1.42A1,1,0,0,1,21,15.5Z");
const ICON_SCALE = 0.045;    // of the button's radius, so it travels with it
const ICON_TILT  = -7;       // degrees, counter-clockwise

/* Drawn rather than set in type. A guillemet sits on the text baseline and its
   ink is nowhere near the middle of the em, so setting one never lands in the
   centre of a circle however it is aligned. */
function chevron(x, y, s, dir){
  ctx.save();
  ctx.translate(x, y);
  ctx.strokeStyle = "#00ff00"; ctx.lineWidth = s * 0.30;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath();
  ctx.moveTo(-dir * s * 0.34, -s * 0.52);
  ctx.lineTo( dir * s * 0.34, 0);
  ctx.lineTo(-dir * s * 0.34, s * 0.52);
  ctx.stroke();
  ctx.restore();
}
function drawButton(b){
  const by = btnY(b);
  if (b.chev) { ring(b.x, by, b.r, ringW(b)); chevron(b.x, by, b.r * 0.42, b.chev); return; }
  /* A toggle is the same two-stage circle as the big buttons, with the inner
     disc standing for the setting: an empty ring is the default, the disc
     filled in is the other choice. The word does not change with it. */
  if (b.toggle) {
    const on = b.on(), rw = ringW(b);
    ring(b.x, by, b.r, rw);
    if (on) {
      ctx.fillStyle = "#00ff00";
      ctx.beginPath(); ctx.arc(b.x, by, b.dr === undefined ? b.r * TOGGLE_DR : b.dr, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.save();
    ctx.translate(b.x, by);
    if (b.rot) ctx.rotate(b.rot * Math.PI / 180);
    label(b.text(), 0, 0, b.fs || 12, on ? "#000000" : "#00ff00", "center",
          on ? 600 : 500, undefined, b.lh);
    ctx.restore();
    return;
  }
  /* The main menu's three big buttons: a filled disc with its own ring standing
     off it, which is how the original drew them. */
  if (b.solid) {
    const rw = ringW(b);
    ctx.fillStyle = "#00ff00";
    ctx.beginPath(); ctx.arc(b.x, by, b.dr, 0, Math.PI*2); ctx.fill();
    ctx.lineWidth = rw; ctx.strokeStyle = "#00ff00";
    ctx.beginPath(); ctx.arc(b.x, by, b.r - rw/2, 0, Math.PI*2); ctx.stroke();
    /* The original set each of these labels on its own slight angle, measured
       here off the artwork rather than guessed. */
    ctx.save();
    ctx.translate(b.x, by);
    if (b.rot) ctx.rotate(b.rot * Math.PI / 180);
    label(b.label, 0, 0, b.fs || 14, "#000000", "center", 600, undefined, b.lh);
    ctx.restore();
    return;
  }
  if (b.sound) {
    ring(b.x, by, b.r, ringW(b));
    ctx.save();
    ctx.translate(b.x, by);
    ctx.rotate(ICON_TILT * Math.PI / 180);
    const s = b.r * ICON_SCALE;
    ctx.scale(s, s);
    ctx.translate(-12, -12);                  // the icon's own 24x24 centre
    ctx.fillStyle = "#00ff00";
    ctx.fill(ICON_SPEAKER);
    ctx.fill(soundOn ? ICON_WAVES : ICON_MUTE);
    ctx.restore();
    return;
  }
  ring(b.x, by, b.r, ringW(b));
  ctx.save();
  ctx.translate(b.x, by);
  if (b.rot) ctx.rotate(b.rot * Math.PI / 180);
  label(b.label, 0, 0, b.fs || 14, "#00ff00", "center", b.big ? 600 : 500, undefined, b.lh);
  ctx.restore();
}
function drawMenu(){
  const list = MENUS[scene]; if (!list) return;
  for (const b of list) {
    if (scene === SC.PLAYMENU && b.label === "resume" && !resumable()) {
      ctx.save(); ctx.globalAlpha = 0.28; drawButton(b); ctx.restore();
    } else if (scene === SC.TUT && b.chev === -1 && tutStep === 0) {
      ctx.save(); ctx.globalAlpha = 0.28; drawButton(b); ctx.restore();
    } else drawButton(b);
  }
}
/* One field unit, unless the window is small enough that one unit falls under a
   device pixel, in which case the line would render as a grey smear instead of a
   green line. Everything is drawn through a uniform scale of q, so a unit is q
   device pixels and 1/q units is exactly one of them. */
function hair(){ return Math.max(TOP_LINE, 1/q); }
function topRule(){
  ctx.fillStyle = "#007f00";
  ctx.fillRect(0, TOP, W, hair());
}
/* Eleven dashes and ten gaps of equal length span the field exactly, so the line
   starts and ends on a dash against the walls rather than trailing off in air. */
function baseline(){
  const h = hair(), d = W / 21;
  ctx.fillStyle = "#007f00";
  for (let i = 0; i < 11; i++) ctx.fillRect(i * 2 * d, P.baseline - h/2, d, h);
}
/* Grown inwards, so that clamping to a device pixel can never push a line off
   the edge of the canvas and lose half of it. The sides start level with the top
   of the rule rather than at the top of the screen, so the corner is flush and
   neither line runs past the other, and a fourth line closes the bottom. */
/* A phone's display has rounded corners and the canvas runs full bleed into
   them, so a square box loses its bottom corners to the curve and reads as
   broken. Curving the bottom two lets the line follow the screen instead of
   being cut by it; 34 units is roughly a recent iPhone's corner radius scaled
   into this field, and on a square display it simply looks deliberate. The top
   two get half a ball's radius, which is small enough that no ball can ever
   reach into the curve, so it costs the playfield nothing. */
const EDGE_R  = 34;
const EDGE_RT = SHOT_R / 2;
/* The bottom line sits one line width up from the very edge rather than on it. */
function edgeBox(){
  const h = hair(), k = h/2, t = TOP + k, b = H - k - h, R = EDGE_R, r = EDGE_RT;
  ctx.save();
  ctx.strokeStyle = "#007f00"; ctx.lineWidth = h;
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(k, t + r);
  ctx.quadraticCurveTo(k, t, k + r, t);
  ctx.lineTo(W - k - r, t);
  ctx.quadraticCurveTo(W - k, t, W - k, t + r);
  ctx.lineTo(W - k, b - R);
  ctx.quadraticCurveTo(W - k, b, W - k - R, b);
  ctx.lineTo(k + R, b);
  ctx.quadraticCurveTo(k, b, k, b - R);
  ctx.closePath();
  ctx.stroke();
  ctx.restore();
}

const QUIET = "#007f00";
/* Number on top, its caption under it: best under the best, and under the score
   three dots, which is the way back to the menu. No word for it on the field.
   SCORE_BASE is the bottom of the whole block, measured up from the bottom of
   the screen, so the two rows are placed from there upward. */
const LAB_PX = 15, LAB_CAP = 0.70, SCORE_GAP = 13;
const SCORE_LAB_Y = H - SCORE_BASE - LAB_PX * LAB_CAP / 2;
const SCORE_NUM_Y = SCORE_LAB_Y - LAB_PX * LAB_CAP / 2 - SCORE_GAP;
/* The tap target does not have to match the ink, so the dots stay small while
   the thing you press stays comfortable, and the arrow never sweeps past x 97
   so it cannot be caught while aiming. */
/* Each column hangs off its own edge, so a number grows inward as it gains
   digits and nothing ever reaches the screen edge. */
const SCORE_MARGIN = 12;
const FIELD_MENU = { x: SCORE_MARGIN + 11, fy: SCORE_LAB_Y, r:24,
                     act:function(){ scene = SC.MENU; } };
/* textAlign lines up the advance box, which carries the face's side bearings,
   so a number and the caption under it set to the same edge still do not have
   their ink flush with each other. Barlow's digits carry about a unit on each
   side; the dots are drawn ink-first and carry none, which is the gap. These
   place the ink itself, so every edge of the block lands on the margin. */
function inkText(text, x, y, px, weight, face, color, base, right){
  ctx.font = weight + " " + px + "px " + face;
  ctx.textAlign = right ? "right" : "left";
  ctx.textBaseline = base;
  const m = ctx.measureText(text);
  const b = right ? m.actualBoundingBoxRight : m.actualBoundingBoxLeft;
  ctx.fillStyle = color;
  ctx.fillText(text, x + (isFinite(b) ? (right ? -b : b) : 0), y);
}
/* x is the left edge of the group, so the dots set flush with the score above
   them rather than on its centre. */
function dots(x, y, color){
  ctx.fillStyle = color;
  const r = 2.2;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath(); ctx.arc(x + r + i * 9, y, r, 0, Math.PI*2); ctx.fill();
  }
}
function drawGame(){
  /* With the walls on the rule is the top of the box, corners and all; with them
     off it is a plain line across the screen, square as it always was. */
  if (wallsOn) edgeBox(); else topRule();
  baseline();

  /* The score sits under everything that is in play, so a ball that rolls down
     into the corner passes over its own number rather than behind it. */
  /* high tracks the score upward as you play, so being level with it is what
     beating it looks like from inside the round. Both numbers brighten together,
     because what is happening is one number becoming the other. */
  const hot = score > 0 && score >= high;
  const nc  = hot ? "#00ff00" : QUIET;
  inkText(String(score), SCORE_MARGIN, SCORE_NUM_Y, SCORE_PX, 700, BARLOW, nc, "alphabetic", false);
  inkText(String(high), W - SCORE_MARGIN, SCORE_NUM_Y, SCORE_PX, 700, BARLOW, nc, "alphabetic", true);
  inkText("best", W - SCORE_MARGIN, SCORE_LAB_Y, LAB_PX, 500, FREDOKA, QUIET, "middle", true);
  if (scene === SC.GAME) dots(SCORE_MARGIN, SCORE_LAB_Y, QUIET);

  for (const s of statics) drawBall(s.x, s.y, s.r, s.type, s.hits);

  if (ball) {
    const bx = lerp(ball.px, ball.x, alphaT), by = lerp(ball.py, ball.y, alphaT);
    drawBall(bx, by, lerp(ball.pr, ball.r, alphaT), ball.type, 2,
             lerp(ball.pspin, ball.spin, alphaT));
    if (ball.state === "aim") {
      ctx.save();
      ctx.translate(bx, by);
      ctx.rotate(lerp(prevAim, aimAngle, alphaT));
      ctx.globalAlpha = aiming ? 1 : 0.45;
      drawArrow();
      ctx.restore();
    }
  }

  for (const p of pts) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - p.t/0.9);
    label("+" + p.n, Math.min(W - 16, Math.max(16, p.x)), p.y, 20, "#00ff00", "center", 600);
    ctx.restore();
  }

}

function drawOver(){
  drawGame();
  ctx.save();
  ctx.fillStyle = "rgba(0,0,0," + (0.91 + overFlash*0.06) + ")";
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
  slotLabel("A", "game\nover", 32, -3.3, 0.80);
  ring(SLOT.B.x, SLOT.B.fy, SLOT.B.r, SLOT.B.r * RING_K);
  drawNumberMid(score, SLOT.B.x, SLOT.B.fy, 58, "center");
  drawMenu();
}

/* Bottom right, the side the original used, with the subtitle centred on the
   mark rather than hung off its right edge. The mark is set right-aligned, so
   its centre has to be measured rather than assumed. */
/* The subtitle is set to whatever size makes its ink exactly as wide as the
   mark's, so the two lines square off into a block instead of one word floating
   under another. Measured off the ink rather than the advance box, because the
   two are set at different sizes and weights and their side bearings do not
   scale together. */
let TM = null, TMfixed = false;
function inkW(text, px, weight){
  ctx.font = weight + " " + px + "px " + FREDOKA;
  ctx.textAlign = "left";
  const m = ctx.measureText(text);
  return { w: m.actualBoundingBoxLeft + m.actualBoundingBoxRight, l: m.actualBoundingBoxLeft };
}
function titleM(){
  if (TM && TMfixed) return TM;
  const mark = inkW("frict", TITLE_PX, 600);
  const sub  = inkW(SUBTITLE, 100, 400);
  const px   = sub.w > 0 ? 100 * mark.w / sub.w : 12;
  /* Right-aligned, so the mark's ink ends at TITLE_R and starts a width back. */
  const x0   = TITLE_R - mark.w;
  const y    = TITLE_Y + TITLE_PX * TITLE_CAP + SUB_GAP + px * TITLE_CAP;
  TM = { px: px, y: y, x0: x0,
         mid: ((TITLE_Y - TITLE_PX * TITLE_CAP) + (y + px * TITLE_CAP)) / 2 };
  try { TMfixed = document.fonts.check('600 ' + TITLE_PX + 'px "Fredoka"'); } catch(e){}
  return TM;
}
function titleBlock(){
  const m = titleM();
  label("frict", TITLE_R, TITLE_Y, TITLE_PX, "#00ff00", "right", 600);
  /* The quiet green the rule, the dashed line and the score use. It used to be
     that colour at 55% over black, which is a step darker again and read as a
     different, muddier green. */
  inkText(SUBTITLE, m.x0, m.y, m.px, 400, FREDOKA, QUIET, "middle", false);
}
function drawTitle(){
  drawMenu();
  titleBlock();
}

function drawTut(){
  const t = TUT_TEXT[tutStep];
  /* The original set these in caps; everything else in this game is lowercase. */
  label(t[0].toLowerCase(), 24, V(54), 24, "#00ff00", "left", 600);
  let y = V(88);
  for (const para of t[1]) y = body(para, 24, y, 18, 272) + 10;

  if (tutStep === 1) {
    /* Same dashed line and same launch point the playfield uses, so the
       illustration and the real thing sit at identical heights. */
    baseline();
    const ly = launchY();
    ctx.save(); ctx.translate(160, ly); ctx.rotate(-0.35); drawArrow(); ctx.restore();
    drawBall(160, ly, SHOT_R, "normal", 2);
  } else if (tutStep === 2) {
    drawBall(90, V(320), 13, "normal", 2);
    drawBall(210, V(320), 42, "normal", 2);
    ctx.save(); ctx.globalAlpha = .45; ctx.strokeStyle = "#00ff00"; ctx.lineWidth = 2;
    ctx.setLineDash([4,5]); ctx.beginPath(); ctx.arc(210, V(320), 52, 0, Math.PI*2); ctx.stroke(); ctx.restore();
  } else if (tutStep === 3) {
    drawBall(96, V(322), 37, "normal", 2);
    drawBall(214, V(322), 37, "normal", 1);
    label("2 hits left", 96, V(357), 12, "#007f00", "center", 500);
    label("1 hit left", 214, V(357), 12, "#007f00", "center", 500);
  } else if (tutStep === 4) {
    /* Labels flush left to one another, the whole block centred on the screen. */
    const rows = ["double","triple","razor"];
    const br = 17, bigR = br * RAZOR_SCALE, gap = 13;
    ctx.font = "500 15px " + FREDOKA;
    let tw = 0;
    for (let i=0;i<3;i++) tw = Math.max(tw, ctx.measureText(rows[i]).width);
    const gx = 160 - (bigR*2 + gap + tw)/2 + bigR;
    const tx = gx + bigR + gap;
    for (let i=0;i<3;i++){
      const yy = V(300 + i*42);
      drawBall(gx, yy, rows[i] === "razor" ? bigR : br, rows[i], 2);
      label(rows[i], tx, yy, 15, "#00ff00", "left", 500);
    }
  } else {
    drawBall(160, V(322), 46, "normal", 2);
  }
  drawMenu();
}

/* The mark does not move when you come in here. It stays in the bottom right
   corner it occupies on the menu, at the same size, so the screen reads as the
   menu with its buttons swapped for text rather than as a new page. */
function drawAbout(){
  titleBlock();
  let y = V(160);
  y = body("Frict was originally created by Joris Truyen and released on the iOS App Store in the late 2000's.", 30, y, 16, 260) + 14;
  body("This version is a fan reconstruction and update of the original game, based on fond memories and tuned for modern phones.", 30, y, 16, 260);
  drawMenu();
}

function drawHiscore(){
  titleBlock();
  slotLabel("A", "high\nscore", 32, -4, 0.80);
  ring(SLOT.B.x, SLOT.B.fy, SLOT.B.r, SLOT.B.r * RING_K);
  drawNumberMid(high, SLOT.B.x, SLOT.B.fy, 58, "center");
  drawMenu();
}

/* The heading is the filled circle, the way the original had it, and the speaker
   says whether sound is on without needing a caption under it. */
function drawSettings(){
  titleBlock();
  slotLabel("C", "settings", 27, -6.1);
  drawMenu();
}

function drawPlayMenu(){
  /* A ring rather than a disc, so it reads as the heading and not a button. */
  drawButton(slot("A", { fs:48, rot:4.8, label:"play!" }));
  drawMenu();
}
function drawReset(){
  slotLabel("B", "reset?", 46, 2.7);
  drawMenu();
}

function render(){
  ctx.setTransform(q, 0, 0, q, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#000000";
  ctx.fillRect(0, 0, W, H);
  if      (scene === SC.GAME)     drawGame();
  else if (scene === SC.OVER)     drawOver();
  else if (scene === SC.TUT)      drawTut();
  else if (scene === SC.ABOUT)    drawAbout();
  else if (scene === SC.HISCORE)  drawHiscore();
  else if (scene === SC.SETTINGS) drawSettings();
  else if (scene === SC.PLAYMENU) drawPlayMenu();
  else if (scene === SC.RESET)    drawReset();
  else                            drawTitle();
  drawDbg();
}

/* Fixed timestep. A 13 mini drives the display at 60Hz and a 17 Pro at 120Hz;
   stepping a constant 1/120s makes both simulate exactly the same game. */
const DBG = /[?&]debug/.test(location.search);
const dbg = { t:[], steps:[0,0,0,0,0,0], line:"", line2:"", worst:0, hitches:0 };
function dbgSample(ms, n){
  if (!DBG) return;
  dbg.t.push(ms); dbg.steps[Math.min(5, n)]++;
  if (ms > dbg.worst) dbg.worst = ms;
  if (dbg.t.length < 60) return;
  const a = dbg.t.slice().sort(function(x,y){ return x-y; });
  const pc = function(k){ return a[Math.floor(a.length*k)]; };
  const over = dbg.t.filter(function(x){ return x > 20; }).length;
  if (dbg.worst > 40) dbg.hitches++;
  dbg.line = "fps " + Math.round(1000/pc(0.5)) + "  p50 " + pc(0.5).toFixed(1) +
             "  p95 " + pc(0.95).toFixed(1) + "  max " + dbg.worst.toFixed(0) +
             "  >20ms " + Math.round(100*over/dbg.t.length) + "%  hitch " + dbg.hitches;
  const r = cvs.getBoundingClientRect(), dp = window.devicePixelRatio || 1;
  const rw = rotated() ? r.height : r.width, rh = rotated() ? r.width : r.height;
  const exact = Math.abs(rw*dp - cvs.width) < 0.6 && Math.abs(rh*dp - cvs.height) < 0.6;
  dbg.line2 = "dpr " + dp + "  css " + rw.toFixed(2) + "x" + rh.toFixed(2) +
              "  buf " + cvs.width + "x" + cvs.height + (exact ? "  1:1" : "  RESAMPLED");
  dbg.t = []; dbg.steps = [0,0,0,0,0,0]; dbg.worst = 0;
}
function drawDbg(){
  if (!DBG || !dbg.line) return;
  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,.75)"; ctx.fillRect(0, 0, W, 34);
  ctx.font = "500 9px monospace"; ctx.textAlign = "left"; ctx.textBaseline = "top";
  ctx.fillStyle = "#00ff00";
  ctx.fillText(dbg.line, 5, 6); ctx.fillText(dbg.line2, 5, 19);
  ctx.restore();
}

const STEP = 1/120;
let last = 0, acc = 0;
function frame(ts){
  let dt = last ? (ts - last)/1000 : STEP;
  last = ts;
  /* Cap catch-up at three frames. If something stalls the main thread the
     simulation loses that time rather than teleporting through it. */
  if (dt > 0.05) dt = 0.05;
  acc += dt;
  let guard = 0, nsteps = 0;
  while (acc >= STEP && guard++ < 60) { stepWorld(STEP); acc -= STEP; nsteps++; }
  dbgSample(dt * 1000, nsteps);
  /* Whatever is left in the accumulator is how far past the last physics step
     this frame sits. Drawing at that fraction between the previous and current
     state is what keeps motion smooth when the display's cadence is not an
     exact multiple of the step, which is the normal case on real hardware. */
  alphaT = Math.max(0, Math.min(1, acc / STEP));
  render();
  requestAnimationFrame(frame);
}

/* ---------------------------------------------------------------- boot */
function start(saved){
  if (saved && typeof saved.high === "number" && saved.high > high) high = saved.high;
  /* Measure first. This used to restore the saved game against the default
     height of 693 and only then discover the real one, which is why a resumed
     ball and arrow turned up in the wrong place. */
  remeasure();
  loadGame();
  /* A face used only by canvas fillText is not always fetched, because nothing
     in the DOM references it. Ask for it explicitly. */
  if (document.fonts && document.fonts.load) {
    document.fonts.load('700 42px "Barlow"');
    document.fonts.load('400 18px "Barlow"');
    document.fonts.load('600 40px "Fredoka"');
  }
  requestAnimationFrame(frame);
}
if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
  window.claude.hot.snapshot(function(){ return { high: high }; });
}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});

})();

</script>
</body>
</html>
