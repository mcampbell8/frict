<title>Frict</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Archivo:wght@100..900&display=swap">
<style>
  *{box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{margin:0;background:#000;-webkit-font-smoothing:antialiased}
  /* Fixed and centred in both orientations. The rotated state used to switch
     this element from static to fixed, which means the box it is positioned
     against changes underneath it, and iOS does not always put it back where it
     was. Now only the two dimensions and the rotate term change. */
  .screen{position:fixed;top:50%;left:50%;width:100vw;height:100vh;
          transform:translate(-50%,-50%);transform-origin:center;
          display:flex;align-items:center;justify-content:center;background:#000}
  @supports (height:1svh){ .screen{ height:100svh; } }
  .screen canvas{display:block;touch-action:none;cursor:pointer;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    will-change:transform;transform:translateZ(0)}
  .screen canvas:focus{outline:none}
  /* Portrait lock. Android obeys the manifest and never reaches this. iOS gives
     a web page no orientation lock at all, so a phone held sideways gets the
     whole screen turned back a quarter turn instead. The max-height guard keeps
     a desktop browser in landscape out of it. */
  @media (orientation:landscape) and (max-height:600px){
    .screen{width:100vh;height:100vw;
            transform:translate(-50%,-50%) rotate(90deg)}
    /* Turning the other way has to be answered the other way, or the game reads
       upside down in one of the two landscapes. */
    html[data-rot="ccw"] .screen{transform:translate(-50%,-50%) rotate(-90deg)}
  }
  @supports (height:1svh){
    @media (orientation:landscape) and (max-height:600px){
      .screen{width:100svh;height:100svw}
    }
  }
</style>
</head>
<body>
<div class="screen">
  <canvas id="game" width="320" height="693" tabindex="0"
          aria-label="Frict. Press and hold to aim, release to shoot."></canvas>
</div>
<script>
window.PORTRAIT_LOCK = true;
(function(){
  /* screen.orientation.angle counts counter-clockwise from the device's natural
     orientation, so 90 means the phone was turned counter-clockwise and the
     page has to turn back the same way. */
  var el = document.documentElement;
  function set(){
    var a = 0, so = window.screen && screen.orientation;
    if (so && typeof so.angle === "number") a = so.angle;
    else if (typeof window.orientation === "number") a = ((window.orientation % 360) + 360) % 360;
    el.setAttribute("data-rot", a === 90 ? "ccw" : a === 270 ? "cw" : "none");
  }
  set();
  var so = window.screen && screen.orientation;
  if (so && so.addEventListener) so.addEventListener("change", set);
  window.addEventListener("orientationchange", set);
  window.addEventListener("resize", set);
})();
</script>

   Safari the browser chrome takes about 183pt of height, so it fills the height

const W = 320, H = 693;

   which reads as stutter even at a clean frame rate. */
const ARROW_PATH = new Path2D("M-5.6 -35.2C-7.5 -49.2 -7.6 -49.5 -10.1 -50.0C-12.7 -50.5 -12.7 -50.6 -6.4 -57.4L-0.1 -64.3L6.3 -57.4C12.7 -50.6 12.7 -50.5 10.0 -50.2L7.3 -49.9L5.5 -35.4L3.7 -21.0L0.0 -21.0L-3.6 -21.0L-5.6 -35.2ZM3.4 -37.6C4.4 -45.2 5.7 -51.8 6.2 -52.1C6.8 -52.5 5.7 -54.4 3.6 -56.6L-0.0 -60.5L-3.6 -56.6C-5.6 -54.5 -6.8 -52.5 -6.2 -52.1C-5.7 -51.8 -4.5 -45.7 -3.6 -38.5C-1.6 -23.5 -1.4 -22.7 0.3 -23.2C1.0 -23.5 2.2 -28.8 3.4 -37.6Z");
const ARROW_BASE = 21;
/* Score numerals are set in Archivo Black. NUMCAP is its cap height as a
   fraction of the font size, used to centre digits inside the score rings. */
const ARCHIVO = '"Archivo",Helvetica,Arial,sans-serif';
const FREDOKA = '"Fredoka","Trebuchet MS",sans-serif';
const NUMCAP  = 0.72;   // Archivo cap height as a fraction of font size

let actx = null; const BUF = {};
/* Five complete sets of the three sounds, from the ones the game shipped with
   to a bubble sharpened until it is nearly a click. Original is the bundle's own
   three; the other four share the two-beat bubble ending. The choice is a
   preference, not a calibration value: it saves itself the moment it changes,
   Restore defaults leaves it alone, and it has no bearing on whether a round
   counts toward the best. */
const SCHEMES = [
  ["original", "pop_original", "tap_original", "over_original"],
  ["bubble",   "pop_bubble",   "tap_bubble",   "over_bubble"],
  ["gentle",   "pop_gentle",   "tap_gentle",   "over_bubble"],
  ["tight",    "pop_tight",    "tap_tight",    "over_bubble"],
  ["snap",     "pop_snap",     "tap_snap",     "over_bubble"]
];
let scheme = store.get("scheme", 0);
if (!(scheme >= 0 && scheme < SCHEMES.length)) scheme = 0;
function clipKey(name){
  if (name === "pop") return SCHEMES[scheme][1];
  if (name === "tap") return SCHEMES[scheme][2];
  return SCHEMES[scheme][3];
}
function setScheme(d){
  scheme = (scheme + d + SCHEMES.length) % SCHEMES.length;
  store.set("scheme", scheme);
  play("pop", 0.55);
}

function audioInit(){
  if (actx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  /* "interactive" asks for the smallest buffer the platform will give. Some of
     the delay between a hit and the sound is the device's own output latency,
     which a web page cannot remove; this asks for as little of it as possible. */
  try { actx = new AC({ latencyHint: "interactive" }); }
  catch(e){ try { actx = new AC(); } catch(e2){ return; } }
  setTimeout(decodeClips, 0);   // base64 -> ArrayBuffer, not inside the press
}
/* Bubble 1 is the pop (a ball leaving the field); bubble 2 is the tap (menus
   and a ball surviving a hit); two copies of bubble 1, a fifth apart and 125 ms
   apart, end the round. Both bubbles
   are cut back to the zero crossing before their loudest sample, raised a tone,
   given a short burst of their own derivative on the front and a fast decay, so
   each one is at full level within a quarter millisecond and gone in under
   thirty. The ear times an impact by where the waveform jumps and by how long
   it rings; a bubble that swells and then hangs reads as late even when it
   started on time. Nothing on release. */
function decodeClips(){
  if (!actx) return;
  /* Every scheme is decoded up front, so switching between them is instant. */
  Object.keys(A).forEach(function(key){
    if (key.indexOf("pop_") && key.indexOf("tap_") && key.indexOf("over_")) return;
    const bin = atob(A[key].split(",")[1]);
    const arr = new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    actx.decodeAudioData(arr.buffer, function(b){ BUF[key] = b; }, function(){});
  });
}
let soundOn = store.get("sound", true);
function play(name, vol, delay){
  const key = clipKey(name);
  if (!soundOn || !actx || !BUF[key]) return;
  try {
    const s = actx.createBufferSource(); s.buffer = BUF[key];
    const g = actx.createGain(); g.gain.value = vol===undefined?0.7:vol;
    s.connect(g); g.connect(actx.destination);
    /* Scheduled against the audio clock rather than a setTimeout, so the wait
       is exact and does not drift with whatever the main thread is doing. */
    s.start(delay ? actx.currentTime + delay : 0);
  } catch(e){}
}

/* ---------------------------------------------------------------- canvas */
const cvs = document.getElementById("game");
const ctx = cvs.getContext("2d");
let q = 1;
/* Sizing is measured only when the element actually changes size. Reading
   getBoundingClientRect inside the animation loop forced a synchronous layout
   of the whole page on every frame, which is what made this stutter. The
   backing store is capped at 2x: past that the extra pixels cost real
   fill rate and buy nothing visible on flat vector art. */
/* iOS gives a web app no way to lock the orientation: screen.orientation.lock
   is unimplemented in Safari and the manifest's orientation field is ignored.
   The deploy build therefore turns the whole screen a quarter turn in CSS when
   a phone is held sideways, so the game still presents as portrait. That makes
   two things wrong here unless they are handled: getBoundingClientRect returns
   the rotated bounding box, with width and height swapped, and pointer
   coordinates arrive in screen axes rather than the canvas's own. */
const ROT_Q = (window.PORTRAIT_LOCK && window.matchMedia)
  ? window.matchMedia("(orientation: landscape) and (max-height: 600px)") : null;
function rotated(){ return !!(ROT_Q && ROT_Q.matches); }
/* Which way the page turned. The page itself is always upright to the eye, so
   to keep the game glued to the phone's own frame the turn has to cancel the
   device's: screen.orientation.angle is counter-clockwise from natural, so 90
   is answered with a CSS rotate(-90deg) and 270 with rotate(90deg). The deploy
   page sets data-rot; -1 here means the -90 case. */
function rotDir(){
  if (!rotated()) return 0;
  return document.documentElement.getAttribute("data-rot") === "ccw" ? -1 : 1;
}
if (ROT_Q) {
  const onRot = function(){ remeasure(); };
  if (ROT_Q.addEventListener) ROT_Q.addEventListener("change", onRot);
  else if (ROT_Q.addListener) ROT_Q.addListener(onRot);
}
function measure(){
  /* clientWidth and clientHeight are the box before any transform, which is the
     one the canvas has to fit into. */
  const host = cvs.parentNode;
  const box = { width: host.clientWidth, height: host.clientHeight };
  if (!box.width || !box.height) return;
  /* Fit the fixed field into whatever the window offers, then pin the buffer to
     whole device pixels and derive the CSS size back from it. Sizing the other
     way round leaves the canvas on a half device pixel and every crisp edge
     shimmers as things move across it. */
  const dpr = window.devicePixelRatio || 1;
  const scale = Math.min(box.width / W, box.height / H);
  const bw = Math.max(1, Math.round(W * scale * dpr));
  const qq = bw / W;
  const bh = Math.round(H * qq);
  cvs.style.width  = (bw / dpr) + "px";
  cvs.style.height = (bh / dpr) + "px";
  q = qq;
  if (cvs.width === bw && cvs.height === bh) return;
  cvs.width = bw; cvs.height = bh;
}
/* iOS reports the new size before the rotation has finished settling, so a
   single measurement taken on the event can be of a box that no longer exists a
   frame later. Measure now, again on the next frame, and once more after the
   animation is certainly over. ResizeObserver catches a box that changes size
   but not one that only moves, which is why this exists as well. */
let settleT = 0;
function remeasure(){
  measure();
  requestAnimationFrame(measure);
  clearTimeout(settleT);
  settleT = setTimeout(measure, 320);
}
window.addEventListener("resize", remeasure);
window.addEventListener("orientationchange", remeasure);
if (window.visualViewport) window.visualViewport.addEventListener("resize", remeasure);
if (window.ResizeObserver) new ResizeObserver(measure).observe(cvs.parentNode);
/* H is constant now, so a saved game never needs rescaling on load. */

/* ---------------------------------------------------------------- scenes */
const SC = { MENU:0, PLAYMENU:1, TUT:2, ABOUT:3, SETTINGS:4, HISCORE:5, GAME:6, OVER:7, ADV:8 };

let tutStep = 0;

];

];

];

const TUT_TEXT = [
  ["FRICT",       ["Your goal is to shoot balls into the playfield and score points by removing them again."]],
  ["SHOOT",       ["Touch and hold anywhere on the screen, then release to shoot in the direction of the arrow. If your ball hits the dashed line on its way down, the game is over."]],
  ["SIZE",        ["When the ball stops moving, its size will increase until the ball touches an edge or another ball."]],
  ["SCORE",       ["To score points, remove balls from the playfield by hitting them twice."]],
  ["BONUS BALLS", ["Double ball: every ball removed by this ball adds 2 to your score.",
                   "Triple ball: every ball removed by this ball adds 3 to your score.",
                   "The razor: this ball removes everything in its path."]]
];

/* ---------------------------------------------------------------- state */
let statics = [];
let ball = null;
let score = 0;
let high = store.get("high", 0);
let nextType = "normal";
let aiming = false, aimAngle = 0, aimDir = 1, armed = false;
let pts = [];
let prevAim = 0, alphaT = 0;
let aimDelay = 0;          // dead time after a press, before the arrow moves
let dying = 0;             // seconds of play left to watch before the game over screen
function lerp(a, b, t){ return a + (b - a) * t; }
let inPlay = false;
let overFlash = 0;

const ARROW_DY  = ARROW_BASE - (SHOT_R + ARROW_GAP);
const ARROW_LEN = 64.3 - ARROW_DY;   // tip height above the ball's centre
function drawArrow(){
  ctx.save();
  ctx.translate(0, ARROW_DY);
  ctx.fillStyle = "#00ff00";
  ctx.fill(ARROW_PATH);
  ctx.restore();
}
function launchY(){ return Math.min(H - SHOT_R - 8, P.launch); }
/* Resume is only offered for a game that is genuinely mid-play with a ball
   waiting. A finished round leaves its statics behind but clears inPlay. */
function resumable(){ return inPlay && ball !== null; }

/* The first ball of a game is always plain. From then on the razor is drawn
   first, on a pity counter: 2.5% plus half a point for every ball since the
   last razor, so turn 1 is 3%, turn 10 is 7.5%, turn 20 is 12.5%. A razor
   resets the counter. If the razor misses, the striped balls are drawn flat. */
let turn = 0, pity = 0;
function razorChance(){ return Math.min(1, (2.5 + pity / 2) / 100); }
function dealType(){
  if (turn === 0) { nextType = "normal"; turn++; pity++; return; }
  turn++;
  if (Math.random() < razorChance()) {
    nextType = "razor"; pity = 0;
  } else {
    const r = Math.random();
    nextType = r < 0.07 ? "triple" : r < 0.18 ? "double" : "normal";
  }
  pity++;
}
function makeBall(type){
  const rr = type === "razor" ? SHOT_R * RAZOR_SCALE : SHOT_R;
  const ly = launchY();
  ball = { x: W/2, y: ly, px: W/2, py: ly, vx:0, vy:0, r: rr, pr: rr,
           type: type, state:"aim", spin:0, pspin:0, spinVel:0 };
  armed = false;
}
function readyBall(){ dealType(); makeBall(nextType); }
/* GameDirector in the original had saveGame and isCurrentGameResumable, so a
   round survived leaving the app. This does the same through localStorage. */
/* localStorage is synchronous and can block for tens of milliseconds. These
   used to fire inside the step that landed a ball or took a point, putting a
   stall exactly where the next shot begins. Queued out of the frame instead. */
let saveDue = false, highDue = false;
function saveGame(){ saveDue = true; }
function flushSave(){
  if (highDue) { highDue = false; try { store.set("high", high); } catch(e){} }
  if (!saveDue) return;
  saveDue = false;
  try {
    if (!inPlay || !ball) store.set("game", null);
    else store.set("game", { s: statics, sc: score, t: turn, p: pity, ty: ball.type, rp: runPure });
  } catch(e){}
}
setInterval(flushSave, 1500);
window.addEventListener("pagehide", flushSave);
document.addEventListener("visibilitychange", function(){
  if (document.hidden) { flushSave(); return; }
  /* Coming back from the background with a suspended context makes the first
     sound of the next round arrive late. */
  if (actx && actx.state === "suspended") { try { actx.resume(); } catch(e){} }
});
function loadGame(){
  const g = store.get("game", null);
  if (!g || !g.s || !Array.isArray(g.s)) return false;
  const k = (typeof g.h === "number" && g.h > 0) ? H / g.h : 1;   // older saves
  statics = g.s.map(function(o){ return { x:o.x, y:o.y*k, r:o.r, hits:o.hits, cool:0, type:"normal" }; });
  score = g.sc || 0; turn = g.t || 1; pity = g.p || 0;
  runPure = (g.rp !== false);        // saves from before this rule count as clean
  makeBall(g.ty || "normal");
  pts = []; inPlay = true;
  return true;
}
function newGame(){
  runPure = true;
  statics = []; pts = []; score = 0; overFlash = 0; dying = 0;
  aimAngle = 0; aimDir = 1; aimDelay = 0;
  turn = 0; pity = 0;
  const n = Math.round(P.startBalls);
  let guard = 0;
  while (statics.length < n && guard++ < 600) {
    const r = 22 + Math.random()*16;
    const x = FIELD_L + r + 6 + Math.random()*(FIELD_R - FIELD_L - 2*r - 12);
    const y = FIELD_TOP + 24 + Math.random()*(P.baseline - FIELD_TOP - 130);
    let ok = true;
    for (const s of statics) if (Math.hypot(x-s.x, y-s.y) < s.r + r + 6) { ok = false; break; }
    if (ok) statics.push({ x:x, y:y, r:r, hits:2, cool:0, type:"normal" });
  }
  readyBall();
  inPlay = true;
  saveGame();
  scene = SC.GAME;
}

/* ------------------------------------------------------------- advanced */
/* Laid out in field units rather than the 320x480 design space the round
   buttons use, because the rows are this build's own furniture. */
const ADV_SEL_Y = 108;       // the sound scheme picker, above the sliders
const ADV_TOP = 170;         // first row's text centre
const ADV_DY  = 66;          // row pitch
const ADV_L = 26, ADV_R = 294;
let advDrag = -1;            // index of the row being dragged, -1 for none
let advSaved = 0;            // seconds left on the "saved" flash
function advRowY(i){ return ADV_TOP + i * ADV_DY; }
function advTrackY(i){ return advRowY(i) + 28; }
/* The whole band counts as the control, not just the knob. A thumb is wider
   than nine pixels and the tracks are only three apart from each other. */
/* -1 and 1 step the scheme, 2 plays the current one again. */
function advSelHit(p){
  if (Math.abs(p.y - ADV_SEL_Y) > 19) return 0;
  if (p.x >= 150 && p.x < 212) return -1;
  if (p.x >= 272 && p.x <= 314) return 1;
  if (p.x >= 212 && p.x < 272) return 2;
  return 0;
}
function advHit(p){
  for (let i = 0; i < DIALS.length; i++) {
    const y = advTrackY(i);
    if (p.y > y - 26 && p.y < y + 22) return i;
  }
  return -1;
}
function advSet(i, x){
  const d = DIALS[i];
  let t = (x - ADV_L) / (ADV_R - ADV_L);
  t = Math.max(0, Math.min(1, t));
  let v = d[2] + t * (d[3] - d[2]);
  v = Math.round(v / d[4]) * d[4];
  v = Math.max(d[2], Math.min(d[3], v));
  /* Some steps are fractional, so a straight multiply leaves float dust that
     shows up in the printed value. */
  P[d[0]] = parseFloat(v.toFixed(4));
  runPure = false;
  advSaved = 0;
}

/* ---------------------------------------------------------------- input */
function canvasPoint(ev){
  const r = cvs.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  let dx = ev.clientX - cx, dy = ev.clientY - cy;
  let wpx = r.width, hpx = r.height;
  const rd = rotDir();
  if (rd) {
    /* Under rotate(t), a local vector (lx, ly) lands at screen
       (lx cos t - ly sin t, lx sin t + ly cos t). At +90 that is (-ly, lx), so
       back is lx = dy, ly = -dx; at -90 it is (ly, -lx), so back is lx = -dy,
       ly = dx. */
    const t = dx;
    if (rd < 0) { dx = -dy; dy = t; }
    else        { dx =  dy; dy = -t; }
    wpx = r.height; hpx = r.width;
  }
  return { x: (dx + wpx/2) / wpx * W, y: (dy + hpx/2) / hpx * H };
}
function menuHit(p){
  const list = MENUS[scene]; if (!list) return null;
  for (const b of list) if (Math.hypot(p.x-b.x, p.y-V(b.y)) <= b.r) return b;
  return null;
}
function press(p){
  audioInit(); if (actx && actx.state === "suspended") actx.resume();
  if (scene === SC.GAME) {
    // resumes from the angle it stopped at, but always sweeping rightward first
    if (ball && ball.state === "aim") { aiming = true; aimDir = 1; aimDelay = P.aimDelay; }
    return;
  }
  /* A row takes the press before the round buttons get a look, and takes it
     silently, because a drag is not a button press. */
  if (scene === SC.ADV && p) {
    const d = advSelHit(p);
    if (d) { if (d === 2) play("pop", 0.55); else setScheme(d); return; }
    const i = advHit(p);
    if (i >= 0) { advDrag = i; advSet(i, p.x); return; }
  }
  /* the sound button makes its own noise, or none, so it is skipped here */
  if (p) { const b = menuHit(p); if (b) { if (!b.sound) play("tap", 0.5); b.act(); } }
}
function release(){
  advDrag = -1;
  if (scene === SC.GAME && aiming && ball && ball.state === "aim") {
    aiming = false;
    const a = aimAngle;
    ball.vx =  Math.sin(a) * P.speed;
    ball.vy = -Math.cos(a) * P.speed;
    ball.state = "fly";
    armed = false;
  }
  aiming = false;
}
cvs.addEventListener("pointerdown", function(e){ e.preventDefault(); cvs.focus(); press(canvasPoint(e)); });
window.addEventListener("pointerup", function(){ release(); });
window.addEventListener("pointercancel", function(){ aiming = false; advDrag = -1; });
window.addEventListener("pointermove", function(e){
  if (advDrag < 0) return;
  e.preventDefault();
  advSet(advDrag, canvasPoint(e).x);
});
cvs.addEventListener("keydown", function(e){
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); if (!aiming) press(null); }
  else if (e.key === "Escape") { if (scene === SC.GAME) scene = SC.MENU; }
});
cvs.addEventListener("keyup", function(e){ if (e.key === " " || e.key === "Enter") { e.preventDefault(); release(); } });

/* ---------------------------------------------------------------- rules */
function mult(type){ return type === "double" ? 2 : type === "triple" ? 3 : 1; }
/* Striped balls appear to roll off whatever they touch. Cosmetic only: the kick
   comes from the tangential part of the velocity at the contact and never feeds
   back into vx or vy. */
function spinKick(nx, ny){
  if (ball.type !== "double" && ball.type !== "triple") return;
  const vt = ball.vx * (-ny) + ball.vy * nx;
  ball.spinVel += vt / Math.max(8, ball.r) * 0.715;   // 0.55 + 30%
  if (ball.spinVel >  21) ball.spinVel =  21;
  if (ball.spinVel < -21) ball.spinVel = -21;
}

/* hx,hy is a point along the impact normal, POP_PULL of the way out from the
   removed ball's centre toward where the shot touched it. */
function removeStatic(s, gain, hx, hy){
  const i = statics.indexOf(s); if (i < 0) return;
  statics.splice(i, 1);
  score += gain;
  pts.push({ x: (hx === undefined ? s.x : hx), y: (hy === undefined ? s.y : hy), n:gain, t:0 });
  play("pop", 0.55);
  if (score > high && scoreCounts()) { high = score; highDue = true; }
}
function hitStatic(s, type, hx, hy){
  if (s.cool > 0) return;
  s.cool = 0.18;
  if (type === "razor") { removeStatic(s, 1, hx, hy); return; }
  s.hits -= 1;
  if (s.hits <= 0) removeStatic(s, mult(type), hx, hy);
  else play("tap", 0.5);
}
/* Death is not instant: the sound lands and the ball is left to travel for a
   moment so you see what killed you, then the screen comes up. */
const REST_HOLD = 1/6;       // pause once the ball stops, before grow or vanish
const DEATH_HOLD = 0.35;
/* The failure sound lands a beat after the ball is lost rather than on top of
   it, so the hit and the verdict are two separate events. */
const OVER_DELAY = 0.15;
const DEATH_SLOWMO = 0.30;   // the last moment plays slowly enough to read
function gameOver(){
  if (dying > 0) return;
  aiming = false;
  inPlay = false; saveGame();
  play("over", 0.7, OVER_DELAY);
  dying = DEATH_HOLD;
}
function endRound(){
  ball = null; overFlash = 1; dying = 0;
  scene = SC.OVER;
}
function land(){
  if (!armed) { gameOver(); return; }
  /* Put the ball back inside first: wedged between statics it can finish a
     substep slightly out of bounds, which made the clearance come out negative
     and the SHOT_R floor below then grew it straight through the wall. */
  ball.x = Math.min(FIELD_R - ball.r, Math.max(FIELD_L + ball.r, ball.x));
  ball.y = Math.max(FIELD_TOP + ball.r, ball.y);
  ball.px = ball.x; ball.py = ball.y;
  const wall = Math.min(ball.x - FIELD_L, FIELD_R - ball.x,
                        ball.y - FIELD_TOP, P.baseline - ball.y);
  let t = wall;
  for (const s of statics) t = Math.min(t, Math.hypot(ball.x-s.x, ball.y-s.y) - s.r);
  t = Math.max(SHOT_R, t);
  t = Math.max(2, Math.min(t, wall));   // the floor may not breach a boundary
  ball.type = "normal";
  ball.r0 = ball.r; ball.target = t; ball.gt = 0;
  ball.state = "grow";
}

function stepBall(dt){
  if (!ball) return;
  ball.px = ball.x; ball.py = ball.y; ball.pr = ball.r; ball.pspin = ball.spin;
  prevAim = aimAngle;
  if (ball.state === "aim") {
    if (aiming) {
      /* A short dead time so a quick tap barely moves the arrow at all. */
      if (aimDelay > 0) { aimDelay -= dt; return; }
      const lim = 80 * Math.PI / 180;   // 160 degrees of release arc in total
      aimAngle += aimDir * P.sweep * Math.PI/180 * dt;
      if (aimAngle >  lim) { aimAngle =  lim; aimDir = -1; }
      if (aimAngle < -lim) { aimAngle = -lim; aimDir =  1; }
    }
    return;
  }
  /* A ball that has come to rest waits a beat before it does anything, so the
     stop reads as a stop rather than running straight into the next animation. */
  if (ball.state === "rest") {
    ball.gt += dt;
    if (ball.gt >= REST_HOLD) {
      if (ball.type === "razor") { ball.r0 = ball.r; ball.gt = 0; ball.state = "spend"; }
      else land();
    }
    return;
  }
  if (ball.state === "spend") {
    ball.gt += dt;
    const k = Math.min(1, ball.gt / 0.32);
    ball.r = ball.r0 * (1 - k*k);
    ball.spin += (1 - k) * 9 * dt;
    if (k >= 1) readyBall();
    return;
  }
  if (ball.state === "grow") {
    ball.gt += dt;
    const k = P.growTime > 0 ? Math.min(1, ball.gt / P.growTime) : 1;
    ball.r = ball.r0 + (ball.target - ball.r0) * k;
    if (k >= 1) {
      ball.r = ball.target;
      statics.push({ x:ball.x, y:ball.y, r:ball.r, hits:2, cool:0, type:"normal" });
      readyBall();
      saveGame();
    }
    return;
  }

  const sp = Math.hypot(ball.vx, ball.vy);
  if (ball.type === "razor") ball.spin += sp * 0.030 * dt;
  else if (ball.type === "double" || ball.type === "triple") {
    ball.spin += ball.spinVel * dt;
    ball.spinVel *= Math.pow(0.22, dt);
  }
  const sub = Math.max(1, Math.min(8, Math.ceil(sp * dt / 3)));
  const h = dt / sub;
  for (let k = 0; k < sub; k++) {
    /* Plain exponential decay takes the same fraction per second whatever the
       speed, which is why the tail of the roll feels slippery. Below gripAt the
       retained fraction is scaled down on a ramp that is 0 at the threshold and
       1 at a standstill, so the bite arrives gradually and there is no step at
       the crossing point. grip = 1 leaves the old behaviour untouched. */
    const v = Math.hypot(ball.vx, ball.vy);
    let keep = P.friction;
    if (P.gripAt > 0 && v < P.gripAt) {
      keep = P.friction * Math.pow(P.grip, 1 - v / P.gripAt);
    }
    const f = Math.pow(keep, h);
    ball.vx *= f; ball.vy *= f;
    ball.x += ball.vx * h;
    ball.y += ball.vy * h;

    for (let i = statics.length - 1; i >= 0; i--) {
      const s = statics[i];
      const dx = ball.x - s.x, dy = ball.y - s.y;
      const d = Math.hypot(dx, dy);
      if (d >= s.r + ball.r) continue;
      const nx = dx/(d||1), ny = dy/(d||1);
      if (ball.type === "razor") { hitStatic(s, "razor", s.x + nx*s.r*POP_PULL, s.y + ny*s.r*POP_PULL); continue; }
      ball.x = s.x + nx*(s.r + ball.r);
      ball.y = s.y + ny*(s.r + ball.r);
      spinKick(nx, ny);
      const scoring = dying <= 0;
      const dot = ball.vx*nx + ball.vy*ny;
      ball.vx = (ball.vx - 2*dot*nx) * P.bounce;
      ball.vy = (ball.vy - 2*dot*ny) * P.bounce;
      if (scoring) hitStatic(s, ball.type, s.x + nx*s.r*POP_PULL, s.y + ny*s.r*POP_PULL);
    }

    /* Walls last. Pushing clear of a static can eject the ball past a wall, and
       running this first left it outside until the following substep. */
    if (ball.x - ball.r < FIELD_L) { ball.x = FIELD_L + ball.r; spinKick(1, 0); ball.vx = -ball.vx * P.bounce; }
    if (ball.x + ball.r > FIELD_R) { ball.x = FIELD_R - ball.r; spinKick(-1, 0); ball.vx = -ball.vx * P.bounce; }
    if (ball.y - ball.r < FIELD_TOP) { ball.y = FIELD_TOP + ball.r; spinKick(0, 1); ball.vy = -ball.vy * P.bounce; }

    if (!armed && ball.y + ball.r < P.baseline) armed = true;
    if (dying <= 0 && ball.type !== "razor") {
      /* Turning back downward without ever having cleared the line ends it on
         the spot, rather than letting the ball wander below and off screen. */
      if (!armed && ball.vy > 0) { gameOver(); break; }
      if (armed && ball.vy > 0 && ball.y + ball.r >= P.baseline) { gameOver(); break; }
    }
    if (ball.y - ball.r > H + 40) {
      if (ball.type === "razor") { readyBall(); return; }
      if (dying > 0) { endRound(); return; }
      gameOver(); return;
    }
  }

  if (dying <= 0 && Math.hypot(ball.vx, ball.vy) < P.stopAt) {
    ball.vx = 0; ball.vy = 0;
    ball.gt = 0; ball.state = "rest";
  }
}

function stepWorld(dt){
  if (dying > 0) { dying -= dt; if (dying <= 0) { endRound(); return; } }
  for (const s of statics) if (s.cool > 0) s.cool -= dt;
  for (let i = pts.length - 1; i >= 0; i--) {
    pts[i].t += dt; pts[i].y -= 26*dt;
    if (pts[i].t > 0.9) pts.splice(i, 1);
  }
  if (overFlash > 0) overFlash = Math.max(0, overFlash - dt*1.4);
  if (advSaved > 0) advSaved -= dt;
  if (scene === SC.GAME) stepBall(dying > 0 ? dt * DEATH_SLOWMO : dt);
}

/* ---------------------------------------------------------------- draw */
/* Vector balls. Proportions measured off the decoded PVRTC textures:
   ring outer 1.00R, ring inner 0.875R, inner disc 0.75R, stripe width 0.17R;
   razor hole 0.55R, spike valley 0.72R, 12 points. */
function stripeBars(x, y, r, n, clipR, color, spin){
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, clipR, 0, Math.PI*2); ctx.clip();
  ctx.translate(x, y); ctx.rotate(-Math.PI/4 + (spin || 0));
  ctx.fillStyle = color;
  const wd = Math.max(1, r*0.17), span = r*1.6, gap = n === 2 ? r*0.80 : r*0.52;
  for (let i = 0; i < n; i++) ctx.fillRect(-span, (i - (n-1)/2)*gap - wd/2, span*2, wd);
  ctx.restore();
}
function drawBall(x, y, r, type, hits, spin){
  const G = "#00ff00";
  if (r <= 0.6) return;
  if (type === "razor") {
    const pts = 12, off = spin || 0;
    ctx.beginPath();
    for (let i = 0; i < pts*2; i++) {
      const a = i/(pts*2)*Math.PI*2 - Math.PI/2 + off;
      const rr = (i % 2 === 0) ? r : r*0.72;
      const px = x + Math.cos(a)*rr, py = y + Math.sin(a)*rr;
      if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
    }
    ctx.closePath();
    ctx.moveTo(x + r*0.55, y);
    ctx.arc(x, y, r*0.55, 0, Math.PI*2, true);
    ctx.closePath();
    ctx.fillStyle = G; ctx.fill("evenodd");
    return;
  }
  ctx.beginPath();
  ctx.arc(x, y, r*0.9375, 0, Math.PI*2);
  ctx.lineWidth = Math.max(1, r*0.125);
  ctx.strokeStyle = G;
  ctx.stroke();
  const n = type === "double" ? 2 : type === "triple" ? 3 : 0;
  if (hits >= 2) {
    ctx.beginPath(); ctx.arc(x, y, r*0.75, 0, Math.PI*2);
    ctx.fillStyle = G; ctx.fill();
    if (n) stripeBars(x, y, r, n, r*0.75, "#000000", spin);
  } else if (n) {
    stripeBars(x, y, r, n, r*0.80, G, spin);
  }
}
/* x,y is the baseline. drawNumberMid centres the digits on y instead. */
function drawNumber(n, x, y, px, align){
  ctx.font = "900 " + px + "px " + ARCHIVO;
  ctx.textAlign = align || "left";
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "#00ff00";
  ctx.fillText(String(n), x, y);
}
function drawNumberMid(n, x, cy, px, align){
  drawNumber(n, x, cy + px * NUMCAP / 2, px, align);
}
function ring(x, y, r, lw){
  ctx.beginPath(); ctx.arc(x, y, r - lw/2, 0, Math.PI*2);
  ctx.fillStyle = "#000"; ctx.fill();
  ctx.lineWidth = lw; ctx.strokeStyle = "#00ff00"; ctx.stroke();
}
function label(text, x, y, size, color, align, weight, face){
  ctx.font = (weight||500) + " " + size + "px " + (face || FREDOKA);
  ctx.textAlign = align || "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = color || "#00ff00";
  const lines = String(text).split("\n");
  const lh = size * 1.02;
  for (let i=0;i<lines.length;i++) ctx.fillText(lines[i], x, y + (i - (lines.length-1)/2) * lh);
}
/* Body copy is Archivo at weight 300, drawn straight with no width tricks. */
const BODYWT = 300;
function body(text, x, y, size, maxw, color){
  ctx.font = BODYWT + " " + size + "px " + ARCHIVO;
  ctx.textAlign = "left"; ctx.textBaseline = "top";
  ctx.fillStyle = color || "#d8f5d8";
  const words = String(text).split(" ");
  let line = "", yy = y;
  for (let i=0;i<words.length;i++){
    const test = line ? line + " " + words[i] : words[i];
    if (ctx.measureText(test).width > maxw && line) { ctx.fillText(line, x, yy); yy += size*1.42; line = words[i]; }
    else line = test;
  }
  if (line) { ctx.fillText(line, x, yy); yy += size*1.42; }
  return yy;
}
function drawButton(b){
  if (b.sound) {
    ring(b.x, V(b.y), b.r, 5);
    /* The cone spans -18..+6 and the waves reach +33, so the group's own centre
       sits about 8px right of the origin. Shift left by that to centre it. */
    ctx.save();
    ctx.translate(b.x - 8, V(b.y));
    ctx.strokeStyle = "#00ff00"; ctx.fillStyle = "#00ff00"; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-18, -8); ctx.lineTo(-6, -8); ctx.lineTo(6, -20);
    ctx.lineTo(6, 20); ctx.lineTo(-6, 8); ctx.lineTo(-18, 8);
    ctx.closePath(); ctx.fill();
    if (soundOn) {
      for (let i=1;i<=2;i++){
        ctx.beginPath(); ctx.arc(8, 0, 8+i*8, -Math.PI/3, Math.PI/3); ctx.stroke();
      }
    } else {
      ctx.beginPath();
      ctx.moveTo(16, -11); ctx.lineTo(32, 11);
      ctx.moveTo(32, -11); ctx.lineTo(16, 11);
      ctx.stroke();
    }
    ctx.restore();
    return;
  }
  ring(b.x, V(b.y), b.r, 5);
  label(b.label, b.x, V(b.y), b.fs || 14, "#00ff00", "center", b.big ? 600 : 500);
}
function drawMenu(){
  const list = MENUS[scene]; if (!list) return;
  for (const b of list) {
    if (scene === SC.PLAYMENU && b.label === "resume" && !resumable()) {
      ctx.save(); ctx.globalAlpha = 0.28; drawButton(b); ctx.restore();
    } else if (scene === SC.TUT && b.label === "‹" && tutStep === 0) {
      ctx.save(); ctx.globalAlpha = 0.28; drawButton(b); ctx.restore();
    } else drawButton(b);
  }
}
function wordmark(x, y, size){
  label("frict", x, y, size, "#00ff00", "center", 600);
}
function topRule(){
  ctx.save();
  ctx.strokeStyle = "#007f00"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, TOP); ctx.lineTo(W, TOP); ctx.stroke();
  ctx.restore();
}
function baseline(){
  ctx.save();
  ctx.strokeStyle = "#007f00"; ctx.lineWidth = 2; ctx.setLineDash([16,16]);
  ctx.beginPath(); ctx.moveTo(8, P.baseline); ctx.lineTo(312, P.baseline); ctx.stroke();
  ctx.restore();
}

function drawGame(){
  topRule();
  baseline();
  for (const s of statics) drawBall(s.x, s.y, s.r, s.type, s.hits);

  if (ball) {
    const bx = lerp(ball.px, ball.x, alphaT), by = lerp(ball.py, ball.y, alphaT);
    drawBall(bx, by, lerp(ball.pr, ball.r, alphaT), ball.type, 2,
             lerp(ball.pspin, ball.spin, alphaT));
    if (ball.state === "aim") {
      ctx.save();
      ctx.translate(bx, by);
      ctx.rotate(lerp(prevAim, aimAngle, alphaT));
      ctx.globalAlpha = aiming ? 1 : 0.45;
      drawArrow();
      ctx.restore();
    }
  }

  for (const p of pts) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - p.t/0.9);
    label("+" + p.n, Math.min(W - 16, Math.max(16, p.x)), p.y, 20, "#00ff00", "center", 600);
    ctx.restore();
  }

  const npx = SCORE_PX, by = H - SCORE_BASE;
  drawNumber(score, 12, by, npx, "left");
  drawNumber(high, 308, by, npx, "right");
  ctx.font = "900 " + npx + "px " + ARCHIVO;
  const hw = ctx.measureText(String(high)).width;
  label("best", 308 - hw/2, by - npx * NUMCAP - 13, 15, "#00ff00", "center", 500);
}

function drawOver(){
  drawGame();
  ctx.save();
  ctx.fillStyle = "rgba(0,0,0," + (0.91 + overFlash*0.06) + ")";
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
  label("game\nover", 160, V(86), 36, "#00ff00", "center", 600);
  ring(160, V(196), 62, 5);
  drawNumberMid(score, 160, V(196), 58, "center");
  const nb = score >= high && score > 0 && scoreCounts();
  label(nb ? "new best!" : "best: " + high, 160, V(268), nb ? 22 : 19, "#00ff00", "center", 500);
  /* Said plainly, so a big score that did not move the best does not read as a
     bug. */
  if (!scoreCounts()) label("tuned, not recorded", 160, V(288), 13, "#00a000", "center", 500);
  drawMenu();
}

function drawTitle(){
  drawMenu();
  wordmark(160, V(356), 46);
  ctx.save(); ctx.globalAlpha = 0.55;
  label("sjimpansee · 2009", 160, V(388), 11, "#007f00", "center", 400);
  ctx.restore();
}

function drawTut(){
  const t = TUT_TEXT[tutStep];
  /* The original set these in caps; everything else in this game is lowercase. */
  label(t[0].toLowerCase(), 24, V(54), 24, "#00ff00", "left", 600);
  let y = V(88);
  for (const para of t[1]) y = body(para, 24, y, 18, 272) + 10;

  if (tutStep === 1) {
    /* Same dashed line and same launch point the playfield uses, so the
       illustration and the real thing sit at identical heights. */
    baseline();
    const ly = launchY();
    ctx.save(); ctx.translate(160, ly); ctx.rotate(-0.35); drawArrow(); ctx.restore();
    drawBall(160, ly, SHOT_R, "normal", 2);
  } else if (tutStep === 2) {
    drawBall(90, V(320), 13, "normal", 2);
    drawBall(210, V(320), 42, "normal", 2);
    ctx.save(); ctx.globalAlpha = .45; ctx.strokeStyle = "#00ff00"; ctx.lineWidth = 2;
    ctx.setLineDash([4,5]); ctx.beginPath(); ctx.arc(210, V(320), 52, 0, Math.PI*2); ctx.stroke(); ctx.restore();
  } else if (tutStep === 3) {
    drawBall(96, V(322), 37, "normal", 2);
    drawBall(214, V(322), 37, "normal", 1);
    label("2 hits left", 96, V(357), 12, "#007f00", "center", 500);
    label("1 hit left", 214, V(357), 12, "#007f00", "center", 500);
  } else if (tutStep === 4) {
    /* Labels flush left to one another, the whole block centred on the screen. */
    const rows = ["double","triple","razor"];
    const br = 17, bigR = br * RAZOR_SCALE, gap = 13;
    ctx.font = "500 15px " + FREDOKA;
    let tw = 0;
    for (let i=0;i<3;i++) tw = Math.max(tw, ctx.measureText(rows[i]).width);
    const gx = 160 - (bigR*2 + gap + tw)/2 + bigR;
    const tx = gx + bigR + gap;
    for (let i=0;i<3;i++){
      const yy = V(300 + i*42);
      drawBall(gx, yy, rows[i] === "razor" ? bigR : br, rows[i], 2);
      label(rows[i], tx, yy, 15, "#00ff00", "left", 500);
    }
  } else {
    drawBall(160, V(322), 46, "normal", 2);
  }
  drawMenu();
}

function drawAbout(){
  wordmark(160, V(70), 44);
  label("reconstructed", 160, V(96), 16, "#00bf00", "center", 500);
  let y = V(160);
  y = body("Frict was created by Joris Truyen and published by Sjimpansee in April 2009, built on the cocos2d-iphone engine.", 30, y, 16, 260) + 14;
  body("This version was rebuilt from the original app bundle and updated for modern phones.", 30, y, 16, 260);
  drawMenu();
}

function drawHiscore(){
  label("high\nscore", 160, V(96), 30, "#00ff00", "center", 600);
  ring(160, V(210), 68, 5);
  drawNumberMid(high, 160, V(210), 64, "center");
  drawMenu();
}

function drawAdv(){
  label("advanced", 160, V(50), 25, "#00ff00", "center", 600);
  /* The picker reads as one control: a name between two arrows, with the middle
     replaying whatever is selected so it can be judged without leaving. */
  label("sound", ADV_L, ADV_SEL_Y, 14, "#00a000", "left", 500);
  label("\u2039", 186, ADV_SEL_Y, 21, "#00ff00", "center", 500);
  label(SCHEMES[scheme][0], 242, ADV_SEL_Y, 15, "#00ff00", "center", 600);
  label("\u203a", 298, ADV_SEL_Y, 21, "#00ff00", "center", 500);
  ctx.save();
  ctx.lineCap = "round";
  for (let i = 0; i < DIALS.length; i++) {
    const d = DIALS[i], v = P[d[0]];
    const ry = advRowY(i), ty = advTrackY(i);
    label(d[1], ADV_L, ry, 14, "#00a000", "left", 500);
    label(dialFmt(d, v), ADV_R, ry, 15, "#00ff00", "right", 600);
    const t = (v - d[2]) / (d[3] - d[2]);
    const kx = ADV_L + Math.max(0, Math.min(1, t)) * (ADV_R - ADV_L);
    ctx.lineWidth = 3;
    ctx.strokeStyle = "#004a00";
    ctx.beginPath(); ctx.moveTo(ADV_L, ty); ctx.lineTo(ADV_R, ty); ctx.stroke();
    ctx.strokeStyle = "#007f00";
    ctx.beginPath(); ctx.moveTo(ADV_L, ty); ctx.lineTo(kx, ty); ctx.stroke();
    ctx.fillStyle = "#00ff00";
    ctx.beginPath(); ctx.arc(kx, ty, advDrag === i ? 12 : 9, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
  if (!dialsAreDefault()) label("off defaults, scores are not recorded", 160, 137, 12, "#00a000", "center", 500);
  if (advSaved > 0) label("saved", 160, 562, 14, "#00ff00", "center", 500);
  drawMenu();
}

function drawSettings(){
  label("settings", 160, V(76), 28, "#00ff00", "center", 600);
  label(soundOn ? "sound on" : "sound off", 160, V(225), 15, "#007f00", "center", 500);
  drawMenu();
}

function render(){
  ctx.setTransform(q, 0, 0, q, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#000000";
  ctx.fillRect(0, 0, W, H);
  if      (scene === SC.GAME)     drawGame();
  else if (scene === SC.OVER)     drawOver();
  else if (scene === SC.TUT)      drawTut();
  else if (scene === SC.ABOUT)    drawAbout();
  else if (scene === SC.HISCORE)  drawHiscore();
  else if (scene === SC.SETTINGS) drawSettings();
  else if (scene === SC.ADV)      drawAdv();
  else if (scene === SC.PLAYMENU) { drawMenu(); wordmark(160, V(356), 46); }
  else                            drawTitle();
  drawDbg();
}

/* Fixed timestep. A 13 mini drives the display at 60Hz and a 17 Pro at 120Hz;
   stepping a constant 1/120s makes both simulate exactly the same game. */
const DBG = /[?&]debug/.test(location.search);
const dbg = { t:[], steps:[0,0,0,0,0,0], line:"", line2:"", worst:0, hitches:0 };
function dbgSample(ms, n){
  if (!DBG) return;
  dbg.t.push(ms); dbg.steps[Math.min(5, n)]++;
  if (ms > dbg.worst) dbg.worst = ms;
  if (dbg.t.length < 60) return;
  const a = dbg.t.slice().sort(function(x,y){ return x-y; });
  const pc = function(k){ return a[Math.floor(a.length*k)]; };
  const over = dbg.t.filter(function(x){ return x > 20; }).length;
  if (dbg.worst > 40) dbg.hitches++;
  dbg.line = "fps " + Math.round(1000/pc(0.5)) + "  p50 " + pc(0.5).toFixed(1) +
             "  p95 " + pc(0.95).toFixed(1) + "  max " + dbg.worst.toFixed(0) +
             "  >20ms " + Math.round(100*over/dbg.t.length) + "%  hitch " + dbg.hitches;
  const r = cvs.getBoundingClientRect(), dp = window.devicePixelRatio || 1;
  const rw = rotated() ? r.height : r.width, rh = rotated() ? r.width : r.height;
  const exact = Math.abs(rw*dp - cvs.width) < 0.6 && Math.abs(rh*dp - cvs.height) < 0.6;
  dbg.line2 = "steps " + dbg.steps.slice(0,5).join("/") + "  dpr " + dp +
              "  buf " + cvs.width + "x" + cvs.height + (exact ? "  1:1" : "  RESAMPLED");
  dbg.t = []; dbg.steps = [0,0,0,0,0,0]; dbg.worst = 0;
}
function drawDbg(){
  if (!DBG || !dbg.line) return;
  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,.75)"; ctx.fillRect(0, 0, W, 34);
  ctx.font = "500 9px monospace"; ctx.textAlign = "left"; ctx.textBaseline = "top";
  ctx.fillStyle = "#00ff00";
  ctx.fillText(dbg.line, 5, 6); ctx.fillText(dbg.line2, 5, 19);
  ctx.restore();
}

const STEP = 1/120;
let last = 0, acc = 0;
function frame(ts){
  let dt = last ? (ts - last)/1000 : STEP;
  last = ts;
  /* Cap catch-up at three frames. If something stalls the main thread the
     simulation loses that time rather than teleporting through it. */
  if (dt > 0.05) dt = 0.05;
  acc += dt;
  let guard = 0, nsteps = 0;
  while (acc >= STEP && guard++ < 60) { stepWorld(STEP); acc -= STEP; nsteps++; }
  dbgSample(dt * 1000, nsteps);
  /* Whatever is left in the accumulator is how far past the last physics step
     this frame sits. Drawing at that fraction between the previous and current
     state is what keeps motion smooth when the display's cadence is not an
     exact multiple of the step, which is the normal case on real hardware. */
  alphaT = Math.max(0, Math.min(1, acc / STEP));
  render();
  requestAnimationFrame(frame);
}

/* ---------------------------------------------------------------- boot */
function start(saved){
  if (saved && typeof saved.high === "number" && saved.high > high) high = saved.high;
  /* Measure first. This used to restore the saved game against the default
     height of 693 and only then discover the real one, which is why a resumed
     ball and arrow turned up in the wrong place. */
  measure();
  loadGame();
  /* A face used only by canvas fillText is not always fetched, because nothing
     in the DOM references it. Ask for it explicitly. */
  if (document.fonts && document.fonts.load) {
    document.fonts.load('900 42px "Archivo"');
    document.fonts.load('300 18px "Archivo"');
    document.fonts.load('400 13px "Archivo"');
    document.fonts.load('600 40px "Fredoka"');
  }
  requestAnimationFrame(frame);
}
if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
  window.claude.hot.snapshot(function(){ return { high: high }; });
}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});

})();

</script>
